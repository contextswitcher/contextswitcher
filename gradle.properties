# AndroidX artifacts (Compose, activity-compose) require this; harmless to
# desktop/:core builds that never see it.
android.useAndroidX=true

# Default 512m daemon heap OOMs D8 while dexing the Compose AARs
# (dex spike).
org.gradle.jvmargs=-Xmx4g

# Configuration cache: reuse the configuration phase across builds.
org.gradle.configuration-cache=true
