name: Publish Android dev build

# Uploads the debug APK as the run's `contextswitcher-dev` artifact — only
# when Oliver asks for it: Actions → "Publish Android
# dev build" → Run workflow, or `gh workflow run android-dev.yml` (add
# `--ref experimental` to put the working branch on the phone). Never on
# push: a stream of pushes would keep producing builds, which Oliver does
# not want GitHub to see as misuse, and the app's update hint would nag.
on:
  workflow_dispatch:

concurrency:
  group: android-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble the debug APK
        run: ./gradlew :android:assembleDebug

      # The app's update hint reads the newest successful run of this workflow
      # and fetches its artifact through nightly.link; a run only counts as
      # successful once the upload is done.
      - name: Name the APK after its commit
        run: cp android/build/outputs/apk/debug/android-debug.apk "contextswitcher-dev-${GITHUB_SHA::7}.apk"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: contextswitcher-dev
          path: contextswitcher-dev-*.apk
          if-no-files-found: error
