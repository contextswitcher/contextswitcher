# Global level: trace for now, while the tool stabilizes — trace statements
# stay in the code and are silenced later by raising this level.
level          = trace

# Third-party libraries (via the slf4j-tinylog bridge) are noisy at debug —
# e.g. JediTermFX logs every parsed control sequence. Keep them at info so our
# own debug logging stays readable.
# org.java_websocket additionally dumps raw binary frame payloads (PING/PONG)
# at trace/debug; a control byte in one (Shift-Out 0x0E) flips a terminal into
# its line-drawing charset, so the console log turns to garbage from there on.
level@com.techsenger    = info
level@com.pty4j         = info
level@org.java_websocket = info

writer1        = console
# Console stays quiet: debug/trace go to the rolling file only (writer2).
writer1.level  = info
writer1.format = {date: HH:mm:ss.SSS} {level} {class-name}.{method}(): {message}

writer2          = rolling file
writer2.file     = #{user.home}/.contextswitcher/logs/contextswitcher_{count}.log
writer2.policies = daily, size: 5mb
writer2.backups  = 10
writer2.format   = {date: yyyy-MM-dd HH:mm:ss.SSS} {level} {class}.{method}(): {message}
